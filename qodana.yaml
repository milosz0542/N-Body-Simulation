####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-cpp:latest
profile:
  name: qodana.recommended
bootstrap: |
  # If you are running in CI, you might need to install Qt/Eigen
  # This section runs before the analysis starts
  apt-get update && apt-get install -y libqt5gui5 libqt5opengl5-dev libeigen3-dev qt6-base-dev libglm-dev libglew-dev libgl1-mesa-dev
include:
  - name: CheckDependencyLicenses